<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguardando aprovação | 3DSJ Precificadora</title>
  <link rel="stylesheet" href="/shared/access.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <div class="bg-glow-green" aria-hidden="true"></div>

  <main class="auth-shell">
    <section class="access-card auth-centered" aria-labelledby="pending-heading">
      <div class="brand-row">
        <span class="brand-logo">3D<span>SJ</span></span>
        <span class="brand-badge">precificadora automática</span>
      </div>

      <header class="auth-header">
        <div id="pending-status-pill" class="hero-tag" style="margin-bottom: 14px;">
          <span class="pulse-dot"></span>
          <span id="pending-status-text">Aguardando liberação</span>
        </div>
        <h1 id="pending-heading" class="auth-title">
          Aguardando <span>aprovação</span>
        </h1>
        <p class="auth-subtitle" id="pending-subtitle">
          Sua conta ainda não foi aprovada. Aguarde a liberação do administrador.
        </p>
      </header>

      <div class="dashed-notice" style="margin-bottom: 18px;">
        <span class="section-kicker">CONTA CONECTADA</span>
        <span id="pending-user-email" class="dashed-notice-title" style="margin-top: 4px;">
          Carregando...
        </span>
        <span class="dashed-notice-sub" id="pending-help-text">
          Assim que o administrador aprovar seu cadastro, clique em "Verificar aprovação" para acessar a calculadora.
        </span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button type="button" id="btn-check-status" class="btn-primary btn-full">
          🔄 Verificar aprovação
        </button>
        <button type="button" id="btn-pending-logout" class="btn-ghost btn-full">
          <span>🚪</span> Sair da conta
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/auth/pending/pending.js"></script>
</body>
</html>
